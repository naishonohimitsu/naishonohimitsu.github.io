<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>内緒の秘密基地 | 内緒の秘密</title>
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --line:#d9ddf2; --text:#111111; --sub:#555a6b; --accent:#1c0dfd; --ink:#111111; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text); line-height: 1.9;
      font-family: "Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .bar { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 20;
      display: flex; align-items: center; padding: 0 20px;
      background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; letter-spacing: .08em; color: inherit; text-decoration: none; }
    .brand:hover { color: var(--accent); }

    main { max-width: 640px; min-height: 100vh; margin: 0 auto; padding: 80px 16px 48px;
      display: flex; align-items: center; animation: fade .7s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .card { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 48px 22px; text-align: center; }
    .label { margin: 0; color: var(--accent); font-size: .85rem; font-weight: 700; letter-spacing: .2em; }
    h1 { margin: 8px 0 0; font-size: clamp(1.5rem, 6vw, 2rem); letter-spacing: .08em; line-height: 1.5; }
    .date { margin: 20px 0 0; font-size: clamp(2.6rem, 14vw, 4rem); font-weight: 700; line-height: 1.2;
      color: var(--accent); letter-spacing: .04em; }
    .date small { font-size: .4em; color: var(--text); margin-left: .3em; letter-spacing: .1em; }
    .btn { display: inline-flex; align-items: center; margin-top: 32px; padding: 11px 24px;
      border: 1px solid var(--ink); border-radius: 999px; text-decoration: none; font-size: .93rem;
      background: var(--ink); color: #fff; transition: border-color .2s, background-color .2s; }
    .btn:hover { border-color: var(--accent); background: var(--accent); }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../">内緒の秘密</a>
  </header>
  <main>
    <div class="card">
      <p class="label">COMING SOON</p>
      <h1>内緒の秘密基地は</h1>
      <p class="date">11/28<small>オープン</small></p>
      <a class="btn" href="../">ホームへ戻る</a>
    </div>
  </main>
</body>
</html>
